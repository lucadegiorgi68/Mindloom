[package]
name = "mindloom"
version = "0.1.0"
edition = "2021"
description = "Organic mind mapping, written in Rust"
license = "MIT"

# Kept outside the main workspace so `cargo test` at the root works on any
# machine without desktop webview libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
mindmap_api = { path = "../crates/mindmap_api" }

[profile.release]
lto = true
codegen-units = 1
strip = true
